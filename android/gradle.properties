org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# O SDK da Onyx depende de bibliotecas anteriores ao AndroidX; o Jetifier as converte.
android.enableJetifier=true
# Na nuvem, o Maven Central responde 429 com frequência; o Gradle repete as
# requisições mais vezes e com intervalos maiores.
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=5000
