# Publica na VPS a Prancheta, web/app, e o servidor de sincronização a cada
# mudança deles na main. As sessões na nuvem saem por um proxy web, que não
# prevê SSH, por isso a conexão parte do GitHub.
#
# O repositório é público, e os registros das execuções também: o endereço e a
# chave ficam em segredos. A chave só executa o comando forçado
# /usr/local/bin/prancheta-publicar, de servidor/implantacao, numa conta sem
# privilégios e sem acesso ao Docker; ele recebe o pacote da versão e troca o
# atalho da versão em uso, e o servidor recomeça com ela. As ações de
# administrador ficam no roteiro servidor/implantacao/preparar-vps.sh.
#
# Segredos: VPS_PRANCHETA_ENDERECO, VPS_PRANCHETA_CHAVE e
# VPS_PRANCHETA_HOSTS_CONHECIDOS, para a conexão; VPS_PRANCHETA_ANFITRIAO,
# opcional, o endereço da Prancheta, para conferir que a versão entrou no ar.
name: Publicar na VPS

on:
  push:
    branches: [main]
    paths: ['web/app/**', 'servidor/**', '.github/workflows/publicar.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-vps
  cancel-in-progress: false

jobs:
  publicar:
    if: github.repository == 'iago-leal/prancheta-infinita'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Testar o servidor
        run: node --test servidor/testes/*.test.cjs

      - name: Conferir a página montada
        run: node web/montagem/montar.cjs --conferir

      - name: Montar o pacote
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/pacote.tgz" HEAD web/app servidor

      - name: Preparar a conexão
        env:
          CHAVE: ${{ secrets.VPS_PRANCHETA_CHAVE }}
          HOSTS_CONHECIDOS: ${{ secrets.VPS_PRANCHETA_HOSTS_CONHECIDOS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/chave
          chmod 600 ~/.ssh/chave
          printf '%s\n' "$HOSTS_CONHECIDOS" > ~/.ssh/known_hosts

      - name: Publicar
        env:
          ENDERECO: ${{ secrets.VPS_PRANCHETA_ENDERECO }}
        run: |
          ssh -i ~/.ssh/chave \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "prancheta@$ENDERECO" "publicar $GITHUB_SHA" < "$RUNNER_TEMP/pacote.tgz"

      - name: Conferir a versão no ar
        env:
          ANFITRIAO: ${{ secrets.VPS_PRANCHETA_ANFITRIAO }}
        run: |
          if [ -z "$ANFITRIAO" ]; then
            echo "::notice::cadastre o segredo VPS_PRANCHETA_ANFITRIAO para conferir cada publicação"
            exit 0
          fi
          no_ar=nao
          for tentativa in $(seq 1 36); do
            if [ "$(curl -fsS --max-time 10 "https://$ANFITRIAO/versao.txt" 2>/dev/null)" = "$GITHUB_SHA" ]; then
              no_ar=sim
              break
            fi
            sleep 5
          done
          if [ "$no_ar" != sim ]; then
            echo "a versão publicada não respondeu no endereço em 3 minutos"
            exit 1
          fi
          echo "a versão $GITHUB_SHA responde no endereço da Prancheta"
          # A sincronização recusa quem não tem uma chave válida, no endereço real.
          sem_chave=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "https://$ANFITRIAO/sync/estado")
          chave_errada=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer chave-errada-$GITHUB_RUN_ID-com-mais-de-32-caracteres" "https://$ANFITRIAO/sync/estado")
          if [ "$sem_chave" != 401 ] || [ "$chave_errada" != 401 ]; then
            echo "a sincronização respondeu $sem_chave sem a chave e $chave_errada com uma chave errada, e não 401"
            exit 1
          fi
          echo "a sincronização recusa pedidos sem a chave e com uma chave errada"
