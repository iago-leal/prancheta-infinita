# Publica na VPS a Prancheta, web/app, e o servidor de sincronização a cada
# mudança deles na main. As sessões na nuvem saem por um proxy web, que não
# prevê SSH, por isso a conexão parte do GitHub.
#
# O repositório é público, e os registros das execuções também: o endereço e a
# chave ficam em segredos. A chave só executa o comando forçado
# /usr/local/bin/prancheta-publicar, de servidor/implantacao, numa conta sem
# privilégios e sem acesso ao Docker; ele recebe o pacote da versão e troca o
# atalho da versão em uso, e o servidor recomeça com ela. As ações de
# administrador ficam no roteiro servidor/implantacao/preparar-vps.sh.
#
# Segredos: VPS_PRANCHETA_ENDERECO, VPS_PRANCHETA_CHAVE e
# VPS_PRANCHETA_HOSTS_CONHECIDOS, para a conexão; VPS_PRANCHETA_ANFITRIAO,
# opcional, o endereço público antigo da Prancheta, para conferir que ele está
# fechado. A versão no ar é conferida na própria VPS, pelo comando de
# publicação, porque a Prancheta só responde pela rede privada.
name: Publicar na VPS

on:
  push:
    branches: [main]
    paths: ['web/app/**', 'servidor/**', '.github/workflows/publicar.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-vps
  cancel-in-progress: false

jobs:
  publicar:
    if: github.repository == 'iago-leal/prancheta-infinita'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Testar o servidor
        run: node --test servidor/testes/*.test.cjs

      - name: Conferir a página montada
        run: node web/montagem/montar.cjs --conferir

      - name: Montar o pacote
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/pacote.tgz" HEAD web/app servidor

      - name: Preparar a conexão
        env:
          CHAVE: ${{ secrets.VPS_PRANCHETA_CHAVE }}
          HOSTS_CONHECIDOS: ${{ secrets.VPS_PRANCHETA_HOSTS_CONHECIDOS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/chave
          chmod 600 ~/.ssh/chave
          printf '%s\n' "$HOSTS_CONHECIDOS" > ~/.ssh/known_hosts

      # O comando da VPS troca a versão e espera o servidor anotar que ela está
      # no ar e que a sincronização recusa pedidos sem a chave; a conferência é
      # feita lá porque, com a rede privada, a Prancheta não responde pela internet.
      - name: Publicar
        env:
          ENDERECO: ${{ secrets.VPS_PRANCHETA_ENDERECO }}
        run: |
          saida=$(ssh -i ~/.ssh/chave \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "prancheta@$ENDERECO" "publicar $GITHUB_SHA" < "$RUNNER_TEMP/pacote.tgz")
          echo "$saida"
          if grep -qx "no ar $GITHUB_SHA" <<< "$saida"; then
            echo "conferido na VPS: a versão $GITHUB_SHA está no ar, e a sincronização recusa pedidos sem a chave"
          else
            echo "::warning::o comando de publicação da VPS ainda é o antigo, sem a conferência no ar; rode de novo o roteiro preparar-vps.sh"
          fi

      # Com a rede privada, o endereço público antigo não pode mais entregar a
      # Prancheta: nem a versão publicada nem uma sincronização que pede a chave.
      - name: Conferir que o endereço público está fechado
        env:
          ANFITRIAO: ${{ secrets.VPS_PRANCHETA_ANFITRIAO }}
        run: |
          if [ -z "$ANFITRIAO" ]; then
            echo "::notice::cadastre o segredo VPS_PRANCHETA_ANFITRIAO, com o endereço público antigo, para conferir que ele está fechado"
            exit 0
          fi
          versao=$(curl -sS --max-time 10 "https://$ANFITRIAO/versao.txt" 2>/dev/null || true)
          sincronizacao=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "https://$ANFITRIAO/sync/estado" 2>/dev/null || true)
          if [ "$versao" = "$GITHUB_SHA" ] || [ "$sincronizacao" = 401 ]; then
            echo "o endereço público ainda entrega a Prancheta (sincronização: $sincronizacao); rode o roteiro preparar-vps.sh na VPS"
            exit 1
          fi
          echo "o endereço público não entrega mais a Prancheta (sincronização: ${sincronizacao:-sem resposta})"
