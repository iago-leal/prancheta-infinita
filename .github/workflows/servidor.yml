# Testa o servidor de sincronização a cada mudança nele.
name: Servidor de sincronização

on:
  push:
    branches: [main]
    paths: ['servidor/**', '.github/workflows/servidor.yml']
  pull_request:
    paths: ['servidor/**', '.github/workflows/servidor.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['18', '22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Testar
        run: node --test servidor/testes/*.test.cjs
