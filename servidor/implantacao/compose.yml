# Contêiner da Prancheta na VPS, instalado pelo roteiro preparar-vps.sh em
# /opt/prancheta/compose.yml e ligado com:
#
#   docker compose --env-file /etc/prancheta/ambiente -f /opt/prancheta/compose.yml up -d
#
# /etc/prancheta/ambiente, legível só pelo administrador, define ANFITRIAO, o
# endereço da Prancheta, que não fica no repositório, e PRANCHETA_UID e
# PRANCHETA_GID, os da conta prancheta, com que o servidor roda.
#
# O código vem de /home/prancheta/publicado, que a conta prancheta atualiza a
# cada publicação, sem acesso ao Docker: o servidor percebe que o atalho
# "atual" mudou e termina, e o Docker o reinicia com a versão nova. Antes da
# primeira publicação, o contêiner só espera o código chegar.
#
# O contêiner não tem privilégios, só lê o próprio sistema de arquivos, fica
# numa rede só com o Traefik, sem saída para a internet, e não vê nenhum
# segredo: as chaves dos aparelhos ficam como resumos em /etc/prancheta/acesso.
name: prancheta

services:
  servidor:
    image: node:22-alpine
    user: "${PRANCHETA_UID:?defina PRANCHETA_UID}:${PRANCHETA_GID:?defina PRANCHETA_GID}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    tmpfs: [/tmp]
    working_dir: /srv/prancheta
    command: ["sh", "-c", "until [ -f atual/servidor/servidor.cjs ]; do sleep 5; done; exec node atual/servidor/servidor.cjs"]
    environment:
      PRANCHETA_DADOS: /dados
      PRANCHETA_CHAVES_ARQUIVO: /run/prancheta/chaves
      PRANCHETA_ENDERECO: 0.0.0.0
      PRANCHETA_PORTA: "8787"
      PRANCHETA_WEB: /srv/prancheta/atual/web/app
      PRANCHETA_PORTA_DA_PAGINA: "8788"
      PRANCHETA_VERSAO: /srv/prancheta/atual
      PRANCHETA_HISTORICO_DIAS: "30"
    volumes:
      - /home/prancheta/publicado:/srv/prancheta:ro
      - /var/lib/prancheta:/dados
      - /etc/prancheta/acesso:/run/prancheta:ro
    networks: [prancheta_borda]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=prancheta_borda"
      # A sincronização, em /sync/, vai para a porta que exige a chave.
      - "traefik.http.routers.prancheta-sincronizacao.rule=Host(`${ANFITRIAO:?defina ANFITRIAO}`) && PathPrefix(`/sync/`)"
      - "traefik.http.routers.prancheta-sincronizacao.entrypoints=websecure"
      - "traefik.http.routers.prancheta-sincronizacao.tls=true"
      - "traefik.http.routers.prancheta-sincronizacao.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.prancheta-sincronizacao.service=prancheta-sincronizacao"
      - "traefik.http.services.prancheta-sincronizacao.loadbalancer.server.port=8787"
      # O resto do endereço é a página.
      - "traefik.http.routers.prancheta-pagina.rule=Host(`${ANFITRIAO:?defina ANFITRIAO}`)"
      - "traefik.http.routers.prancheta-pagina.entrypoints=websecure"
      - "traefik.http.routers.prancheta-pagina.tls=true"
      - "traefik.http.routers.prancheta-pagina.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.prancheta-pagina.service=prancheta-pagina"
      - "traefik.http.services.prancheta-pagina.loadbalancer.server.port=8788"

networks:
  prancheta_borda:
    external: true
