# Contêiner da Prancheta na VPS, instalado pelo roteiro preparar-vps.sh em
# /opt/prancheta/compose.yml e ligado com:
#
#   docker compose --env-file /etc/prancheta/ambiente -f /opt/prancheta/compose.yml up -d
#
# /etc/prancheta/ambiente, legível só pelo administrador, define PRANCHETA_UID
# e PRANCHETA_GID, os da conta prancheta, com que o servidor roda, e, se houver,
# PRANCHETA_BIBLIOTECA_DA_VPS, a subpasta de livros do WebDAV, montada só para
# leitura em /biblioteca; sem ela, uma pasta vazia ocupa o lugar. O caminho fica
# só na VPS e nunca entra no repositório.
#
# O código vem de /home/prancheta/publicado, que a conta prancheta atualiza a
# cada publicação, sem acesso ao Docker: o servidor percebe que o atalho
# "atual" mudou e termina, e o Docker o reinicia com a versão nova. Antes da
# primeira publicação, o contêiner só espera o código chegar.
#
# O contêiner não tem privilégios, só lê o próprio sistema de arquivos, fica
# numa rede só com o Tailscale, sem saída para a internet, e não vê nenhum
# segredo: as chaves dos aparelhos ficam como resumos em /etc/prancheta/acesso.
#
# A Prancheta só responde pela rede privada: o endereço público, que o Traefik
# entregava até o plano 005, foi fechado, e o contêiner não tem rótulos do
# Traefik. O contêiner tailscale entrega a Prancheta por https, com
# o certificado do próprio Tailscale, no nome TAILSCALE_NOME, por padrão
# prancheta, seguido do nome da rede do autor, que não fica no repositório. Ele
# fica na rede da Prancheta e numa segunda rede, só para falar com o Tailscale;
# roda no modo sem interface de rede do sistema, que dispensa privilégios, e
# guarda o login em /var/lib/prancheta-tailscale. O autor faz o login uma vez,
# pelo endereço que o contêiner mostra; nenhuma chave do Tailscale é guardada.
name: prancheta

services:
  servidor:
    image: node:22-alpine
    user: "${PRANCHETA_UID:?defina PRANCHETA_UID}:${PRANCHETA_GID:?defina PRANCHETA_GID}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    tmpfs: [/tmp]
    working_dir: /srv/prancheta
    command: ["sh", "-c", "until [ -f atual/servidor/servidor.cjs ]; do sleep 5; done; exec node atual/servidor/servidor.cjs"]
    environment:
      PRANCHETA_DADOS: /dados
      PRANCHETA_CHAVES_ARQUIVO: /run/prancheta/chaves
      PRANCHETA_ENDERECO: 0.0.0.0
      PRANCHETA_PORTA: "8787"
      PRANCHETA_WEB: /srv/prancheta/atual/web/app
      PRANCHETA_PORTA_DA_PAGINA: "8788"
      PRANCHETA_VERSAO: /srv/prancheta/atual
      PRANCHETA_HISTORICO_DIAS: "30"
      PRANCHETA_BIBLIOTECA: /biblioteca
    volumes:
      - /home/prancheta/publicado:/srv/prancheta:ro
      - /var/lib/prancheta:/dados
      - /etc/prancheta/acesso:/run/prancheta:ro
      - ${PRANCHETA_BIBLIOTECA_DA_VPS:-/var/lib/prancheta-biblioteca-vazia}:/biblioteca:ro
    networks: [prancheta_borda]

  tailscale:
    image: ${TAILSCALE_IMAGEM:-tailscale/tailscale:stable}
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    environment:
      TS_HOSTNAME: ${TAILSCALE_NOME:-prancheta}
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      # A página em / e a sincronização em /sync/, no mesmo endereço.
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - /var/lib/prancheta-tailscale:/var/lib/tailscale
      - /opt/prancheta/tailscale-serve.json:/config/serve.json:ro
    networks: [prancheta_borda, saida]
    depends_on: [servidor]

networks:
  prancheta_borda:
    external: true
  # Só o contêiner do Tailscale usa esta rede, para falar com o Tailscale.
  saida: {}
